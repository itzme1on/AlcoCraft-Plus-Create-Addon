name: Publish

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel"
        type: choice
        options: [release, beta, alpha]
        default: beta
      platform:
        description: "Target platform(s)"
        type: choice
        options: [both, modrinth, curseforge]
        default: both
      dry_run:
        description: "Dry run (build + resolve tasks, do NOT upload)"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compute publish task
        id: task
        run: |
          case "${{ inputs.platform }}" in
            modrinth) t="publishModrinth" ;;
            curseforge) t="publishCurseforge" ;;
            *) t="publishMod" ;;
          esac
          echo "Publish task: $t"
          echo "name=$t" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        run: ./gradlew build ${{ steps.task.outputs.name }} -Prelease_channel=${{ inputs.release_channel }} ${{ inputs.dry_run && '--dry-run' || '' }} --stacktrace
        env:
          MODRINTH_TOKEN: ${{ inputs.platform != 'curseforge' && secrets.MODRINTH_TOKEN || '' }}
          CURSEFORGE_TOKEN: ${{ inputs.platform != 'modrinth' && secrets.CURSEFORGE_TOKEN || '' }}
