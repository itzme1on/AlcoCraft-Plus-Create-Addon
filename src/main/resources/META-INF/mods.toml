modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "All Rights Reserved"
issueTrackerURL = "https://github.com/itzme1on/AlcoCraft-Plus/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_display_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "alcocraftplus"
mandatory = true
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "create"
mandatory = false
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
